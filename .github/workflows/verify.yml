# スニペット帳の確かめ
# 1. tests：鍵のしくみのテスト・自動パスワードと CSP のテスト・リポジトリのファイルが SHA256SUMS と一致するか
# 2. live：https://snippet.eiwa-up.jp/ で配っている中身と守りのヘッダー（CSP）が、このリポジトリと同じか（1時間に1回）
#    違っていれば赤になり、リポジトリの持ち主にメールが届く
name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: '17 * * * *'   # 1時間に1回（毎時17分）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 鍵のしくみのテスト
        run: node tests/test-core.mjs
      - name: 自動パスワード・外のサイトを読まない・CSP のテスト
        run: node tests/test-v2105.mjs app/snippet-book.html deploy/snippet.conf
      - name: リポジトリのファイルが SHA256SUMS と一致するか
        working-directory: app
        run: sha256sum -c SHA256SUMS

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開中のサイトの中身が、このリポジトリと同じか
        run: |
          set -eu
          mkdir live
          for f in $(awk '{print $2}' app/SHA256SUMS); do
            url="https://snippet.eiwa-up.jp/$f"
            [ "$f" = "snippet-book.html" ] && url="https://snippet.eiwa-up.jp/"
            mkdir -p "live/$(dirname "$f")"
            curl -fsS --max-time 30 -o "live/$f" "$url"
          done
          cd live
          sha256sum -c ../app/SHA256SUMS
      - name: 公開中のサイトの CSP が、このリポジトリの deploy/snippet.conf と同じか
        run: |
          set -eu
          want="$(sed -n 's/.*add_header Content-Security-Policy "\([^"]*\)".*/\1/p' deploy/snippet.conf)"
          got="$(curl -fsSI --max-time 30 https://snippet.eiwa-up.jp/ | tr -d '\r' | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: //p')"
          echo "want: $want"
          echo "got : $got"
          [ -n "$want" ] && [ "$want" = "$got" ]
