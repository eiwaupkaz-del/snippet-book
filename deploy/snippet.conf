# 依頼100-snippet（この行は applier の目印。消さない）
# 依頼101-v2003（V2.00.003 の CSP にした目印）
# 依頼102-v2004（V2.00.004 の CSP にした目印）
# スニペット帳を CP2P 本体と別のドメインで配信する。cp2p.conf とは別のファイル。
# 証明書は certbot の nginx 方式（更新も certbot が自動で行う）

server {
    listen 80;
    server_name snippet.eiwa-up.jp;
    location / { return 301 https://snippet.eiwa-up.jp$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name snippet.eiwa-up.jp;

    ssl_certificate     /etc/letsencrypt/live/snippet.eiwa-up.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snippet.eiwa-up.jp/privkey.pem;

    root  /var/www/snippet-book;   # V2 専用の置き場（古い場所 /var/www/cp2p-static/snippet-book/ は V1 のまま残す）
    index snippet-book.html;

    # 守りのヘッダー（いまのスニペット帳には1つも付いていない）
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 依頼101 V2.00.003〜：外へ通信できない形。フォントも同じ場所（fonts/）から。スクリプトはハッシュで指定し、書き足されたスクリプトは動かない（版を上げるたびにハッシュを書きかえる）
    add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-a+AonogZ9/zYW8uUMvWt3aF0g/sMYSLT9TGkvJa7LDY='; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / { try_files /snippet-book.html =404; }
    location / { try_files $uri =404; }
}
